name: DemusRedesign
options:
  bundleIdPrefix: com.demusapp
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"

targets:
  DemusRedesign:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources/DemusRedesign
    info:
      path: Sources/DemusRedesign/Info.plist
      properties:
        UIBackgroundModes:
          - audio
        UILaunchStoryboardName: LaunchScreen
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.demusapp.redesign
      INFOPLIST_FILE: Sources/DemusRedesign/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
      CURRENT_PROJECT_VERSION: 28
      MARKETING_VERSION: "2.0.28"
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
