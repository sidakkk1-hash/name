name: Build Demus iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          # macos-14 has Xcode 16.x pre-installed
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application for iOS (arm64)
        run: |
          xcodebuild -project DemusRedesign.xcodeproj \
            -scheme DemusRedesign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/DemusRedesign.app Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 2.0.24" Payload/DemusRedesign.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 2.0.24" Payload/DemusRedesign.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 24" Payload/DemusRedesign.app/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 24" Payload/DemusRedesign.app/Info.plist
          zip -r DemusRedesign.ipa Payload
          echo "IPA Created Successfully!"
          ls -lh DemusRedesign.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemusRedesign-AppleMusic-IPA
          path: DemusRedesign.ipa
          retention-days: 14
