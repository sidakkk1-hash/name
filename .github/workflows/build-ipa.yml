name: Build Demus iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application for iOS (arm64)
        run: |
          xcodebuild -project DemusRedesign.xcodeproj \
            -scheme DemusRedesign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Build/Products/Release-iphoneos/DemusRedesign.app Payload/
          zip -r DemusRedesign.ipa Payload
          echo "IPA Created Successfully!"
          ls -lh DemusRedesign.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemusRedesign-AppleMusic-IPA
          path: DemusRedesign.ipa
          retention-days: 14
